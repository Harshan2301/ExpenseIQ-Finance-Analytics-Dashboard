<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ExpenseIQ — Login</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="marquee-bar"><div class="marquee-track"><span>◈ EXPENSEIQ</span><span>◆ TRACK SMART</span><span>▲ SPEND BETTER</span><span>◈ EXPENSEIQ</span><span>◆ TRACK SMART</span><span>▲ SPEND BETTER</span></div></div>

<div style="position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;">
  <div style="position:absolute;width:500px;height:500px;border-radius:50%;background:var(--acid);filter:blur(100px);opacity:.05;top:-150px;right:-150px;animation:blob-drift 10s ease-in-out infinite alternate;"></div>
  <div style="position:absolute;width:400px;height:400px;border-radius:50%;background:var(--pink);filter:blur(100px);opacity:.05;bottom:-150px;left:-150px;animation:blob-drift 14s ease-in-out infinite alternate;"></div>
</div>

<div class="auth-shell" style="position:relative;z-index:1;">
  <div class="auth-card liquid-card">
    <div style="text-align:center;margin-bottom:1.5rem;">
      <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;text-transform:uppercase;letter-spacing:-.04em;background:linear-gradient(135deg,var(--acid),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">EXPENSEIQ</div>
      <div style="font-size:.62rem;letter-spacing:.2em;color:var(--mid);text-transform:uppercase;margin-top:.2rem;">Smart Finance OS</div>
    </div>

    <!-- TABS -->
    <div class="auth-tab-bar">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</button>
      <button class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
      <button class="auth-tab" id="tab-forgot" onclick="switchTab('forgot')" style="display:none;">Reset</button>
    </div>

    <!-- LOGIN -->
    <div id="panel-login">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input id="l-email" class="form-input" type="email" placeholder="harsh@expenseiq.app" value="harsh@expenseiq.app"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input id="l-pass" class="form-input" type="password" placeholder="••••••••" value="password123"/>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-bottom:1rem;">
        <button onclick="switchTab('forgot')" style="background:none;border:none;color:var(--acid);font-size:.72rem;cursor:pointer;letter-spacing:.05em;">Forgot password?</button>
      </div>
      <button class="chrome-btn" style="width:100%;padding:.7rem;" onclick="doLogin()">Login →</button>
      <div style="text-align:center;margin-top:1rem;font-size:.75rem;color:var(--mid);">Don't have an account? <button onclick="switchTab('signup')" style="background:none;border:none;color:var(--acid);cursor:pointer;font-weight:600;">Sign Up</button></div>
      <div class="section-divider" style="margin:1rem 0;"></div>
      <button class="chrome-btn ghost" style="width:100%;padding:.65rem;display:flex;align-items:center;justify-content:center;gap:.5rem;" onclick="doLogin()">
        <span>G</span> Continue with Google
      </button>
    </div>

    <!-- SIGNUP -->
    <div id="panel-signup" style="display:none;">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input id="s-fname" class="form-input" placeholder="Harsh"/>
        </div>
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input id="s-lname" class="form-input" placeholder="V."/>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input id="s-email" class="form-input" type="email" placeholder="you@example.com"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input id="s-pass" class="form-input" type="password" placeholder="Min 8 characters"/>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input id="s-pass2" class="form-input" type="password" placeholder="Repeat password"/>
      </div>
      <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:1rem;">
        <input type="checkbox" id="s-terms" style="accent-color:var(--acid);width:14px;height:14px;"/>
        <label for="s-terms" style="font-size:.72rem;color:var(--mid);">I agree to the <span style="color:var(--acid);">Terms of Service</span></label>
      </div>
      <button class="chrome-btn" style="width:100%;padding:.7rem;" onclick="doSignup()">Create Account →</button>
      <div style="text-align:center;margin-top:1rem;font-size:.75rem;color:var(--mid);">Already have an account? <button onclick="switchTab('login')" style="background:none;border:none;color:var(--acid);cursor:pointer;font-weight:600;">Login</button></div>
    </div>

    <!-- FORGOT -->
    <div id="panel-forgot" style="display:none;">
      <p style="font-size:.8rem;color:var(--mid);margin-bottom:1.2rem;">Enter your email to receive a password reset link.</p>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input id="f-email" class="form-input" type="email" placeholder="you@example.com"/>
      </div>
      <button class="chrome-btn" style="width:100%;padding:.7rem;" onclick="doReset()">Send Reset Link →</button>
      <div style="text-align:center;margin-top:1rem;">
        <button onclick="switchTab('login')" style="background:none;border:none;color:var(--acid);font-size:.75rem;cursor:pointer;">← Back to Login</button>
      </div>
    </div>
  </div>
</div>

<div id="toast-wrap"></div>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script>
// Check if redirected to signup
if(location.hash==='#signup') switchTab('signup');

function switchTab(t){
  ['login','signup','forgot'].forEach(p=>{
    document.getElementById('panel-'+p).style.display=p===t?'':'none';
    const tab=document.getElementById('tab-'+p);
    if(tab){tab.classList.toggle('active',p===t);tab.style.display=p==='forgot'&&t!=='forgot'?'none':'';}
  });
  if(t==='forgot') document.getElementById('tab-forgot').style.display='';
}

function doLogin(){
  const e=document.getElementById('l-email')?.value;
  const p=document.getElementById('l-pass')?.value;
  if(!e||!p){showToast('Please fill all fields','error');return;}
  initDB();
  const u=getUser();
  setUser({...u,email:e,name:e.split('@')[0]});
  showToast('Welcome back! Redirecting...','success');
  setTimeout(()=>location.href='dashboard.html',900);
}

function doSignup(){
  const fn=document.getElementById('s-fname')?.value.trim();
  const ln=document.getElementById('s-lname')?.value.trim();
  const e=document.getElementById('s-email')?.value.trim();
  const p=document.getElementById('s-pass')?.value;
  const p2=document.getElementById('s-pass2')?.value;
  const terms=document.getElementById('s-terms')?.checked;
  if(!fn||!e||!p){showToast('Please fill all required fields','error');return;}
  if(p!==p2){showToast('Passwords do not match','error');return;}
  if(p.length<8){showToast('Password must be 8+ characters','error');return;}
  if(!terms){showToast('Please accept Terms of Service','error');return;}
  initDB();
  const initials=(fn[0]+(ln?ln[0]:'')).toUpperCase();
  setUser({name:`${fn} ${ln}`.trim(),email:e,currency:'₹',currencyCode:'INR',avatar:initials});
  showToast('Account created! Welcome to ExpenseIQ!','success');
  setTimeout(()=>location.href='dashboard.html',900);
}

function doReset(){
  const e=document.getElementById('f-email')?.value.trim();
  if(!e){showToast('Enter your email first','error');return;}
  showToast('Reset link sent! (Demo mode)','info');
  setTimeout(()=>switchTab('login'),1500);
}
</script>
</body>
</html>
